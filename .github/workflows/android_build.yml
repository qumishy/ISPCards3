name: Android Build
on:
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً من Termux

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm install

      - name: Build Android APK
        run: npx eas build --platform android --profile preview --local

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "*.apk"
